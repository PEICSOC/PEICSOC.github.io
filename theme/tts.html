<style>
/* =========================
   句子 TTS：文字 + 按鈕（避免 st/nd 跑位）
   ========================= */
.tts-wrap{
  display: inline-flex;
  align-items: center;
  gap: 10px;                 /* ✅ 可改：按鈕與文字距離 */
}
.tts{ display: inline; }

/* =========================
   通用播放按鈕（圖形）
   ========================= */
.tts-btn{
  background: transparent;
  border: 0;
  font: inherit;

  width: 44px;               /* ✅ 可改：點擊區寬 */
  height: 44px;              /* ✅ 可改：點擊區高 */
  padding: 0;

  cursor: pointer;
  line-height: 1;

  display: inline-grid;
  place-items: center;
  position: relative;

  color: var(--md-primary-fg-color, currentColor);
  touch-action: manipulation;
}
.tts-btn:hover{
  color: var(--md-accent-fg-color, var(--md-primary-fg-color, currentColor));
}
.tts-btn[aria-pressed="true"]{
  color: var(--md-accent-fg-color, var(--md-primary-fg-color, currentColor));
  opacity: 0.85;             /* ✅ 可改：播放中提示 */
}
.tts-btn:focus-visible{
  outline: 2px solid var(--md-accent-fg-color, currentColor);
  outline-offset: 3px;
  border-radius: 10px;
}

/* 播放：三角形 */
.tts-btn[data-state="play"]::before{
  content: "";
  display: block;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 9px 0 9px 14px;   /* ✅ 可改：三角形比例 */
  border-color: transparent transparent transparent currentColor;
  transform: translateX(1px);
}

/* 停止：方塊 */
.tts-btn[data-state="stop"]::before{
  content: "";
  display: block;
  width: 16px;                    /* ✅ 可改：方塊大小 */
  height: 16px;
  background: currentColor;
  border-radius: 3px;
}

/* 手機按鈕加大 */
@media (max-width: 600px){
  .tts-btn{ width: 52px; height: 52px; }
  .tts-btn[data-state="play"]::before{ border-width: 10px 0 10px 16px; }
  .tts-btn[data-state="stop"]::before{ width: 18px; height: 18px; }
}

/* =========================
   H1 右邊（靠左）：語音選擇小按鈕 + 展開面板
   ========================= */
/* 不改 h1 佈局（不靠頁面最右），只在文字後插一個 inline 控制 */
.tts-voice-mini{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 10px;

  /* ✅ 讓語音 UI 不跟著 h1 的大字體走，大小跟內文一致 */
  font-size: 1rem;
  font-weight: normal;
  line-height: 1.2;

  vertical-align: middle;
  position: relative; /* popover 參考點 */
}

/* 小喇叭按鈕 */
.tts-voice-toggle{
  width: 30px;                /* ✅ 可改：喇叭大小 */
  height: 30px;
  border-radius: 999px;
  border: 1px solid var(--md-default-fg-color--lightest, rgba(0,0,0,.2));
  background: transparent;
  color: var(--md-primary-fg-color, currentColor);
  cursor: pointer;
  display: inline-grid;
  place-items: center;
}
.tts-voice-toggle:hover{
  color: var(--md-accent-fg-color, var(--md-primary-fg-color, currentColor));
}
.tts-voice-toggle:focus-visible{
  outline: 2px solid var(--md-accent-fg-color, currentColor);
  outline-offset: 2px;
}
.tts-voice-toggle svg{ width: 16px; height: 16px; display:block; fill: currentColor; }

/* 展開面板（預設隱藏，點選才出現） */
.tts-voice-panel{
  position: absolute;
  left: 0;
  top: calc(100% + 8px);
  z-index: 50;

  min-width: min(420px, 92vw);
  padding: 10px 12px;
  border-radius: 14px;

  background: var(--md-default-bg-color, rgba(20,20,20,.92));
  border: 1px solid var(--md-default-fg-color--lightest, rgba(255,255,255,.18));
  box-shadow: 0 10px 30px rgba(0,0,0,.25);

  display: none;
  gap: 10px;
  flex-wrap: wrap;

  /* ✅ 面板文字大小同內文 */
  font-size: 1rem;
  font-weight: normal;
}
.tts-voice-mini.open .tts-voice-panel{ display: flex; }

.tts-voice-panel label{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  color: var(--md-default-fg-color, #ddd);
}

/* 兩個下拉：EN / ZH */
.tts-voice-picker{
  font: inherit;
  font-size: 1rem;            /* ✅ 跟內文一致 */
  border-radius: 10px;
  border: 1px solid var(--md-default-fg-color--lightest, rgba(0,0,0,.2));
  background: transparent;
  color: inherit;
  padding: 6px 10px;
  max-width: min(320px, 80vw);
}

/* 暗色模式 slate：下拉黑底 */
[data-md-color-scheme="slate"] .tts-voice-picker{
  background-color: #1e1e1e;
  color: #fff;
  border-color: rgba(255,255,255,.25);
}
[data-md-color-scheme="slate"] .tts-voice-picker option{
  background-color: #1e1e1e;
  color: #fff;
}

/* =========================
   反白浮動工具（播放 + 翻譯）
   ========================= */
#tts-selection-pop{
  position: fixed;
  z-index: 9999;
  display: none;

  padding: 10px 12px;
  border-radius: 14px;

  background: var(--md-default-bg-color, rgba(20,20,20,.92));
  border: 1px solid var(--md-default-fg-color--lightest, rgba(255,255,255,.18));
  box-shadow: 0 10px 30px rgba(0,0,0,.25);

  align-items: center;
  gap: 12px;
  max-width: min(720px, 92vw);
}

#tts-selection-zh{
  font-size: 13px;
  line-height: 1.35;
  color: var(--md-default-fg-color, #ddd);
  word-break: break-word;
  max-width: min(640px, 78vw);
}
#tts-selection-zh .muted{ opacity: .75; }
</style>

<script>
(function () {
  /* ==============
     你可以改的地方
     ============== */

  const DEFAULT_LANG_EN = "en-US";                      // ✅ 可改：英文預設語言
  const DEFAULT_NAME_EN_INCLUDES = "Google US English"; // ✅ 可改：英文預設 voice 關鍵字

  const DEFAULT_LANG_ZH = "zh-TW";                      // ✅ 可改：中文預設語言（繁中）
  const DEFAULT_NAME_ZH_INCLUDES = "Google";            // ✅ 可改：中文預設 voice 關鍵字（你也可填 "Microsoft" 等）

  const SELECTION_MAX_CHARS = 500;                      // ✅ 你指定：反白最多 500 字
  const TRANSLATE_TO = "zh-TW";                         // ✅ 可改
  const TRANSLATE_FROM = "en";                          // ✅ 可改："auto" 也可，但英文練習建議 en

  /* ==============
     內部狀態
     ============== */

  let currentBtn = null;
  let activeUtterances = []; // 用於混合中英分段朗讀
  let isSpeaking = false;

  const translateCache = new Map();

  // 用「key」儲存語音，避免不同瀏覽器 index 變動
  const LS_VOICE_EN = "ttsVoiceKeyEN";
  const LS_VOICE_ZH = "ttsVoiceKeyZH";
  let voiceKeyEN = safeGetLS(LS_VOICE_EN);
  let voiceKeyZH = safeGetLS(LS_VOICE_ZH);

  // Global：避免重複綁事件
  let globalEventsBound = false;
  let observer = null;
  let scheduled = false;

  function safeGetLS(key){
    try { return localStorage.getItem(key) || null; } catch (_) { return null; }
  }
  function safeSetLS(key, val){
    try { localStorage.setItem(key, val); } catch (_) {}
  }

  function supported() {
    return ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
  }

  function warmVoices() {
    try { speechSynthesis.getVoices(); } catch (_) {}
  }

  function getVoices() {
    return speechSynthesis.getVoices() || [];
  }

  function voiceKey(v){
    // voiceURI 在多數瀏覽器較穩；沒有就用 lang+name
    if (v && v.voiceURI) return "uri:" + v.voiceURI;
    return "nl:" + (v.lang || "") + "||" + (v.name || "");
  }

  function findVoiceByKey(key){
    if (!key) return null;
    const voices = getVoices();
    for (const v of voices) {
      if (voiceKey(v) === key) return v;
    }
    return null;
  }

  function isZhLang(lang){
    const l = (lang || "").toLowerCase();
    return l.startsWith("zh");
  }

  function isEnLang(lang){
    const l = (lang || "").toLowerCase();
    return l.startsWith("en");
  }

  function pickDefaultVoiceKey(voices, langNeedle, nameIncludes){
    if (!voices.length) return null;

    const needle = (nameIncludes || "").toLowerCase();
    const langN = (langNeedle || "").toLowerCase();

    // 1) lang match + name includes
    let v = voices.find(x => (x.lang||"").toLowerCase() === langN && (x.name||"").toLowerCase().includes(needle));
    if (v) return voiceKey(v);

    // 2) name includes
    v = voices.find(x => (x.name||"").toLowerCase().includes(needle));
    if (v) return voiceKey(v);

    // 3) lang exact
    v = voices.find(x => (x.lang||"").toLowerCase() === langN);
    if (v) return voiceKey(v);

    // 4) prefix match (en-* / zh-*)
    const prefix = langN.split("-")[0];
    v = voices.find(x => (x.lang||"").toLowerCase().startsWith(prefix));
    if (v) return voiceKey(v);

    return voiceKey(voices[0]);
  }

  function ensureVoiceKeys(){
    const voices = getVoices();
    if (!voices.length) return;

    if (!voiceKeyEN || !findVoiceByKey(voiceKeyEN)) {
      voiceKeyEN = pickDefaultVoiceKey(voices.filter(v => isEnLang(v.lang)), DEFAULT_LANG_EN, DEFAULT_NAME_EN_INCLUDES)
                || pickDefaultVoiceKey(voices, DEFAULT_LANG_EN, DEFAULT_NAME_EN_INCLUDES);
      if (voiceKeyEN) safeSetLS(LS_VOICE_EN, voiceKeyEN);
    }

    if (!voiceKeyZH || !findVoiceByKey(voiceKeyZH)) {
      voiceKeyZH = pickDefaultVoiceKey(voices.filter(v => isZhLang(v.lang)), DEFAULT_LANG_ZH, DEFAULT_NAME_ZH_INCLUDES)
                || pickDefaultVoiceKey(voices, DEFAULT_LANG_ZH, DEFAULT_NAME_ZH_INCLUDES);
      if (voiceKeyZH) safeSetLS(LS_VOICE_ZH, voiceKeyZH);
    }
  }

  function getVoiceForLangTag(tag){
    // tag: "en" | "zh"
    ensureVoiceKeys();
    if (tag === "zh") return findVoiceByKey(voiceKeyZH) || null;
    return findVoiceByKey(voiceKeyEN) || null;
  }

  /* ===========
     停止朗讀
     =========== */
  function stop() {
    try { speechSynthesis.cancel(); } catch (_) {}

    activeUtterances = [];
    isSpeaking = false;

    if (currentBtn) {
      currentBtn.setAttribute("data-state", "play");
      currentBtn.setAttribute("aria-pressed", "false");
      currentBtn = null;
    }
  }

  /* =========================
     自動分段：中文用 zh，英文用 en
     - 混合文字會拆段依序朗讀
     ========================= */
  function splitByLang(text){
    const s = (text || "");
    const out = [];
    let buf = "";
    let cur = null;

    function flush(){
      const t = buf.trim();
      if (t) out.push({ lang: cur || "en", text: t });
      buf = "";
    }

    function charType(ch){
      if (/[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch)) return "zh"; // CJK
      if (/[A-Za-z]/.test(ch)) return "en";
      return "other";
    }

    for (let i=0;i<s.length;i++){
      const ch = s[i];
      const t = charType(ch);

      // other：跟著前一段走（避免標點被丟掉）
      const lang = (t === "other") ? (cur || "en") : t;

      if (cur === null) cur = lang;

      if (lang !== cur){
        flush();
        cur = lang;
      }
      buf += ch;
    }
    flush();

    // 若整段都沒有中英字母，就當英文（避免空）
    return out.length ? out : [{ lang: "en", text: (s.trim()) }];
  }

  function speakAuto(text, btn){
    if (!supported()) return;

    const t = (text || "").trim();
    if (!t) return;

    const pressed = btn.getAttribute("aria-pressed") === "true";
    if (currentBtn === btn && pressed) {
      stop();
      return;
    }

    stop(); // 停掉別的正在播

    btn.setAttribute("data-state", "stop");
    btn.setAttribute("aria-pressed", "true");
    currentBtn = btn;

    // 建 utterance queue
    const segs = splitByLang(t);
    activeUtterances = segs.map(seg => {
      const u = new SpeechSynthesisUtterance(seg.text);

      // ✅ 可改：語速/音高（這裡是全局）
      u.rate = 1.0;
      u.pitch = 1.0;

      const v = getVoiceForLangTag(seg.lang);
      if (v) {
        u.voice = v;
        u.lang = v.lang || (seg.lang === "zh" ? DEFAULT_LANG_ZH : DEFAULT_LANG_EN);
      } else {
        u.lang = (seg.lang === "zh" ? DEFAULT_LANG_ZH : DEFAULT_LANG_EN);
      }
      return u;
    });

    // 依序播放
    isSpeaking = true;
    playNext();
  }

  function playNext(){
    if (!activeUtterances.length){
      stop();
      return;
    }
    const u = activeUtterances.shift();
    u.onend = () => playNext();
    u.onerror = () => stop();

    warmVoices();
    try { speechSynthesis.speak(u); } catch (_) { stop(); }
  }

  /* =========================
     句子按鈕：綁到 .tts
     ========================= */
  function attachSentenceButtons(root){
    const scope = root || document;
    scope.querySelectorAll(".tts").forEach(textSpan => {
      let wrap = textSpan.closest(".tts-wrap");
      if (!wrap) {
        wrap = document.createElement("span");
        wrap.className = "tts-wrap";
        textSpan.parentNode.insertBefore(wrap, textSpan);
        wrap.appendChild(textSpan);
      }

      if (wrap.querySelector(":scope > button.tts-btn")) return;

      const pure = (textSpan.getAttribute("data-tts") || textSpan.textContent || "").trim();
      textSpan.setAttribute("data-tts", pure);

      const btn = document.createElement("button");
      btn.className = "tts-btn";
      btn.type = "button";
      btn.setAttribute("data-state", "play");
      btn.setAttribute("aria-pressed", "false");
      btn.setAttribute("aria-label", "Play/Stop");

      btn.addEventListener("pointerdown", warmVoices, { passive: true });
      btn.addEventListener("click", () => speakAuto(textSpan.getAttribute("data-tts"), btn));

      wrap.appendChild(btn);
    });
  }

  /* =========================
     H1 右側（靠左）：插入語音選擇 UI
     - EN 與 ZH 分開
     ========================= */
  function ensureVoiceControlsOnAllH1(root){
    const scope = root || document;
    const container =
      scope.querySelector(".md-content .md-content__inner") ||
      scope.querySelector("main") ||
      document.body;

    const h1s = container.querySelectorAll("h1");
    if (!h1s.length) return;

    h1s.forEach(h1 => {
      if (h1.querySelector(":scope > .tts-voice-mini")) return;

      const mini = document.createElement("span");
      mini.className = "tts-voice-mini";

      const toggle = document.createElement("button");
      toggle.className = "tts-voice-toggle";
      toggle.type = "button";
      toggle.setAttribute("aria-label", "Choose voices");
      toggle.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10v4c0 1.1.9 2 2 2h3l4 3V5L8 8H5c-1.1 0-2 .9-2 2zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03z"/>
        </svg>
      `;

      const panel = document.createElement("div");
      panel.className = "tts-voice-panel";

      const labelEN = document.createElement("label");
      labelEN.textContent = "EN";
      const selEN = document.createElement("select");
      selEN.className = "tts-voice-picker";
      selEN.setAttribute("data-voice-kind", "en");

      const labelZH = document.createElement("label");
      labelZH.textContent = "ZH";
      const selZH = document.createElement("select");
      selZH.className = "tts-voice-picker";
      selZH.setAttribute("data-voice-kind", "zh");

      labelEN.appendChild(selEN);
      labelZH.appendChild(selZH);

      panel.appendChild(labelEN);
      panel.appendChild(labelZH);

      mini.appendChild(toggle);
      mini.appendChild(panel);
      h1.appendChild(mini);

      // 點喇叭：開/關 + populate
      toggle.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();

        warmVoices();
        ensureVoiceKeys();
        populatePickers(panel);

        closeAllVoicePanelsExcept(mini);
        mini.classList.toggle("open");

        if (mini.classList.contains("open")) {
          setTimeout(() => { try { selEN.focus(); } catch(_) {} }, 0);
        }
      });

      // mobile friendly：點 select 前先 warm
      selEN.addEventListener("pointerdown", warmVoices, { passive: true });
      selZH.addEventListener("pointerdown", warmVoices, { passive: true });

      selEN.addEventListener("change", () => {
        voiceKeyEN = selEN.value;
        safeSetLS(LS_VOICE_EN, voiceKeyEN);
        syncAllPickers();
      });

      selZH.addEventListener("change", () => {
        voiceKeyZH = selZH.value;
        safeSetLS(LS_VOICE_ZH, voiceKeyZH);
        syncAllPickers();
      });
    });

    // 初次同步一次（即使 voices 還沒載入，也不會壞，onvoiceschanged 會補）
    warmVoices();
    ensureVoiceKeys();
    syncAllPickers();
  }

  function closeAllVoicePanelsExcept(mini){
    document.querySelectorAll(".tts-voice-mini.open").forEach(x => {
      if (x !== mini) x.classList.remove("open");
    });
  }

  function populatePickers(panel){
    const voices = getVoices();

    const selEN = panel.querySelector('select[data-voice-kind="en"]');
    const selZH = panel.querySelector('select[data-voice-kind="zh"]');

    if (selEN) fillSelect(selEN, voices, "en", voiceKeyEN);
    if (selZH) fillSelect(selZH, voices, "zh", voiceKeyZH);
  }

  function fillSelect(sel, voices, kind, selectedKey){
    sel.innerHTML = "";

    const filtered = (kind === "zh")
      ? voices.filter(v => isZhLang(v.lang))
      : voices.filter(v => isEnLang(v.lang));

    const list = filtered.length ? filtered : voices;

    if (!list.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "No voices";
      sel.appendChild(opt);
      return;
    }

    list.forEach(v => {
      const opt = document.createElement("option");
      opt.value = voiceKey(v);
      opt.textContent = `${v.lang} — ${v.name}`;
      sel.appendChild(opt);
    });

    // 若目前選的 key 不在清單，先挑預設
    const exists = list.some(v => voiceKey(v) === selectedKey);
    if (!exists) {
      const fallbackKey =
        (kind === "zh")
          ? pickDefaultVoiceKey(list, DEFAULT_LANG_ZH, DEFAULT_NAME_ZH_INCLUDES)
          : pickDefaultVoiceKey(list, DEFAULT_LANG_EN, DEFAULT_NAME_EN_INCLUDES);

      if (kind === "zh") { voiceKeyZH = fallbackKey; safeSetLS(LS_VOICE_ZH, voiceKeyZH); }
      else { voiceKeyEN = fallbackKey; safeSetLS(LS_VOICE_EN, voiceKeyEN); }

      selectedKey = fallbackKey;
    }

    sel.value = selectedKey || sel.options[0].value;
  }

  function syncAllPickers(){
    // 讓每個 H1 的 panel 兩個 select 都一致
    document.querySelectorAll(".tts-voice-panel").forEach(panel => {
      populatePickers(panel);
    });
  }

  /* =========================
     反白浮動工具：播放 + 翻譯
     + 在翻譯框內選取不觸發新翻譯/不消失
     ========================= */

  function ensureSelectionPop() {
    let pop = document.getElementById("tts-selection-pop");
    if (pop) return pop;

    pop = document.createElement("div");
    pop.id = "tts-selection-pop";

    const btn = document.createElement("button");
    btn.className = "tts-btn";
    btn.type = "button";
    btn.setAttribute("data-state", "play");
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", "Speak selection");

    const zh = document.createElement("div");
    zh.id = "tts-selection-zh";
    zh.innerHTML = '<span class="muted">翻譯載入中…</span>';

    btn.addEventListener("pointerdown", warmVoices, { passive: true });
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();

      const text = getSelectionText();
      if (!text) return; // ✅ 不強制關閉，避免你要複製時被關掉
      speakAuto(text, btn);
    });

    pop.appendChild(btn);
    pop.appendChild(zh);
    document.body.appendChild(pop);
    return pop;
  }

  function getSelectionPopEl() {
    return document.getElementById("tts-selection-pop");
  }

  function nodeInsidePop(node, pop) {
    if (!node || !pop) return false;
    const el = (node.nodeType === Node.TEXT_NODE) ? node.parentNode : node;
    return !!(el && pop.contains(el));
  }

  function selectionTouchesPop() {
    const pop = getSelectionPopEl();
    const sel = window.getSelection ? window.getSelection() : null;
    if (!pop || !sel || sel.rangeCount === 0) return false;
    return nodeInsidePop(sel.anchorNode, pop) || nodeInsidePop(sel.focusNode, pop);
  }

  function hideSelectionPop() {
    const pop = getSelectionPopEl();
    if (pop) pop.style.display = "none";
  }

  function getSelectionText() {
    const sel = window.getSelection ? window.getSelection() : null;
    if (!sel || sel.rangeCount === 0) return "";
    const text = (sel.toString() || "").trim();
    if (!text || text.length > SELECTION_MAX_CHARS) return "";
    return text;
  }

  function getSelectionRect() {
    const sel = window.getSelection ? window.getSelection() : null;
    if (!sel || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return null;
    return rect;
  }

  async function translateToZh(text) {
    const key = `${TRANSLATE_FROM}|${TRANSLATE_TO}|${text}`;
    if (translateCache.has(key)) return translateCache.get(key);

    const url =
      "https://translate.googleapis.com/translate_a/single" +
      `?client=gtx&sl=${encodeURIComponent(TRANSLATE_FROM)}` +
      `&tl=${encodeURIComponent(TRANSLATE_TO)}` +
      `&dt=t&q=${encodeURIComponent(text)}`;

    try {
      const res = await fetch(url, { method: "GET" });
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      const translated = Array.isArray(data?.[0]) ? data[0].map(x => x?.[0] || "").join("") : "";
      translateCache.set(key, translated);
      return translated;
    } catch (_) {
      translateCache.set(key, "");
      return "";
    }
  }

  async function showSelectionPop() {
    if (!supported()) return;

    // ✅ 若你正在翻譯框內反白（要複製），就完全不處理
    if (selectionTouchesPop()) return;

    const text = getSelectionText();
    if (!text) return; // ✅ 不主動關閉，避免干擾複製流程

    const rect = getSelectionRect();
    if (!rect) return;

    const pop = ensureSelectionPop();
    const zh = document.getElementById("tts-selection-zh");

    pop.style.display = "flex";

    const offset = 8;
    const popW = pop.offsetWidth || 240;
    const popH = pop.offsetHeight || 56;

    let left = rect.left + rect.width / 2 - popW / 2;
    let top  = rect.top - popH - offset;

    left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
    if (top < 8) top = rect.bottom + offset;

    pop.style.left = `${left}px`;
    pop.style.top  = `${top}px`;

    if (zh) {
      zh.innerHTML = '<span class="muted">翻譯載入中…</span>';
      const translated = await translateToZh(text);
      zh.textContent = translated ? translated : "（翻譯失敗或被阻擋）";
    }
  }

  function bindGlobalEventsOnce(){
    if (globalEventsBound) return;
    globalEventsBound = true;

    // 反白觸發（但在翻譯框內放開滑鼠不觸發）
    document.addEventListener("mouseup", (e) => {
      const pop = getSelectionPopEl();
      if (pop && e.target && pop.contains(e.target)) return;
      setTimeout(showSelectionPop, 0);
    });

    document.addEventListener("keyup", () => {
      const pop = getSelectionPopEl();
      if (pop && document.activeElement && pop.contains(document.activeElement)) return;
      setTimeout(showSelectionPop, 0);
    });

    // 點外面：關閉語音面板；但不關閉翻譯框（你要複製）
    document.addEventListener("mousedown", (e) => {
      const t = e.target;

      // 關閉所有 voice panel
      document.querySelectorAll(".tts-voice-mini.open").forEach(mini => {
        if (!mini.contains(t)) mini.classList.remove("open");
      });

      // 翻譯框：點外面不強制關閉（你若想點外面關閉，把下一行改成啟用 hideSelectionPop）
      // const pop = getSelectionPopEl(); if (pop && !pop.contains(t)) hideSelectionPop();
    }, { passive: true });

    // 捲動/縮放：翻譯框關閉（避免位置錯）
    window.addEventListener("scroll", hideSelectionPop, true);
    window.addEventListener("resize", hideSelectionPop);

    // voices 可能延遲載入：載入後同步所有 pickers
    if ("speechSynthesis" in window) {
      speechSynthesis.onvoiceschanged = () => {
        ensureVoiceKeys();
        syncAllPickers();
      };
    }

    // Material instant navigation：換頁後重跑
    document.addEventListener("navigation:complete", scheduleEnhance);
  }

  /* =========================
     修正「有時候要重整才出現」：
     - 用 MutationObserver 監看內容區
     - 每次內容變更後，重新補齊 h1 voice UI / .tts buttons
     ========================= */
  function getContentRoot(){
    return document.querySelector(".md-content .md-content__inner") || document.querySelector("main") || document.body;
  }

  function scheduleEnhance(){
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      enhance();
    });
  }

  function enhance(){
    if (!supported()) return;
    const root = getContentRoot();

    attachSentenceButtons(root);
    ensureVoiceControlsOnAllH1(root);
    ensureSelectionPop();
  }

  function startObserver(){
    if (observer) return;
    const root = getContentRoot();
    observer = new MutationObserver(() => scheduleEnhance());
    observer.observe(root, { childList: true, subtree: true });
  }

  function init(){
    if (!supported()) return;
    bindGlobalEventsOnce();
    warmVoices();
    enhance();
    startObserver();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
